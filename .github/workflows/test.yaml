# yamllint disable rule:truthy
---
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # allow manual triggering

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.14"

      # Each check runs even if an earlier one failed, so a single run
      # reports every problem instead of stopping at the first.
      # These invoke the same make targets used locally.
      - name: ruff
        if: ${{ !cancelled() }}
        run: make ruff-check

      - name: black
        if: ${{ !cancelled() }}
        run: make black-check

      - name: pylint
        if: ${{ !cancelled() }}
        run: make pylint-check

      - name: pyrefly
        if: ${{ !cancelled() }}
        run: make pyrefly-check

      - name: rstcheck
        if: ${{ !cancelled() }}
        run: make rst-check

      - name: yamllint
        if: ${{ !cancelled() }}
        run: make yaml-check

  test:
    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Python test suite
        run: python -m pytest tests --ignore=tests/test_all_notebooks.py
